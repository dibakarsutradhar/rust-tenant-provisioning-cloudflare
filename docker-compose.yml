services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: garageos_mtd_demo
      POSTGRES_USER: garageos_tenant
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garageos_tenant -d garageos_mtd_demo"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgres

volumes:
  pgdata:
