<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust Tenant Provisioner — Get Started</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #e8ff47;
      --accent-dark: #b8cc1a;
      --text: #f0f0f0;
      --muted: #888;
      --error: #ff5c5c;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 460px;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      color: var(--accent);
      letter-spacing: -0.5px;
      margin-bottom: 2.5rem;
    }

    .logo span { color: var(--text); }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 2rem;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .subdomain-wrap {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .subdomain-wrap:focus-within { border-color: var(--accent); }

    .subdomain-wrap input {
      border: none;
      border-radius: 0;
      flex: 1;
    }

    .subdomain-suffix {
      padding: 0.75rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
      border-left: 1px solid var(--border);
    }

    .btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #0f0f0f;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.02em;
    }

    .btn:hover { background: var(--accent-dark); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Rust Tenant <span>Provisioner</span></div>
    <h1>Set up your garage</h1>
    <p class="subtitle">Get your own workspace in under a minute.</p>

    <form id="form">
      <div class="form-group">
        <label>Company name</label>
        <input type="text" id="company" placeholder="Dhaka Motors" required>
      </div>
      <div class="form-group">
        <label>Your subdomain</label>
        <div class="subdomain-wrap">
          <input type="text" id="subdomain" placeholder="dhakamotors" required
                 pattern="[a-z0-9\-]+" title="lowercase letters, numbers, hyphens only">
          <span class="subdomain-suffix">.thegarageos.com</span>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="admin@dhakamotors.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="min 6 characters" required minlength="6">
      </div>

      <p class="error" id="error"></p>
      <button class="btn" type="submit" id="btn">Create workspace</button>
    </form>
  </div>

  <script>
    // auto-slugify company name into subdomain
    document.getElementById('company').addEventListener('input', function() {
      const slug = this.value.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      document.getElementById('subdomain').value = slug;
    });

    document.getElementById('form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Setting up...';

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            company:   document.getElementById('company').value,
            subdomain: document.getElementById('subdomain').value,
            email:     document.getElementById('email').value,
            password:  document.getElementById('password').value,
          })
        });

        const data = await res.json();

        if (!res.ok) {
          err.textContent = data.error || 'Something went wrong';
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create workspace';
          return;
        }

        // redirect to status page with tenant_id
        window.location.href = `/status.html?tenant_id=${data.tenant_id}`;
      } catch(e) {
        err.textContent = 'Network error — is the server running?';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Create workspace';
      }
    });
  </script>
</body>
</html>
