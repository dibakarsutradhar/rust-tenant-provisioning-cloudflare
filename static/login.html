<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>GarageOS — Sign in</title>
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root {
				--bg: #0f0f0f;
				--surface: #1a1a1a;
				--border: #2a2a2a;
				--accent: #e8ff47;
				--accent-dark: #b8cc1a;
				--text: #f0f0f0;
				--muted: #888;
				--error: #ff5c5c;
			}

			body {
				font-family: 'DM Sans', sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 2rem;
			}

			.card {
				width: 100%;
				max-width: 420px;
			}

			.logo {
				font-family: 'Syne', sans-serif;
				font-weight: 800;
				font-size: 1.5rem;
				color: var(--accent);
				margin-bottom: 0.5rem;
			}

			.logo span {
				color: var(--text);
			}

			.workspace {
				font-size: 0.8rem;
				color: var(--muted);
				margin-bottom: 2.5rem;
				font-family: monospace;
			}

			h1 {
				font-family: 'Syne', sans-serif;
				font-weight: 700;
				font-size: 1.8rem;
				margin-bottom: 2rem;
			}

			.form-group {
				margin-bottom: 1rem;
			}

			label {
				display: block;
				font-size: 0.8rem;
				font-weight: 500;
				color: var(--muted);
				text-transform: uppercase;
				letter-spacing: 0.05em;
				margin-bottom: 0.4rem;
			}

			input {
				width: 100%;
				background: var(--surface);
				border: 1px solid var(--border);
				color: var(--text);
				padding: 0.75rem 1rem;
				border-radius: 8px;
				font-family: 'DM Sans', sans-serif;
				font-size: 0.95rem;
				outline: none;
				transition: border-color 0.2s;
			}

			input:focus {
				border-color: var(--accent);
			}

			.btn {
				width: 100%;
				padding: 0.85rem;
				background: var(--accent);
				color: #0f0f0f;
				font-family: 'Syne', sans-serif;
				font-weight: 700;
				font-size: 0.95rem;
				border: none;
				border-radius: 8px;
				cursor: pointer;
				margin-top: 1.5rem;
				transition: background 0.2s;
			}

			.btn:hover {
				background: var(--accent-dark);
			}
			.btn:disabled {
				opacity: 0.5;
				cursor: not-allowed;
			}

			.error {
				color: var(--error);
				font-size: 0.85rem;
				margin-top: 1rem;
				display: none;
			}
		</style>
	</head>
	<body>
		<div class="card">
			<div class="logo">Rust Tenant <span>Provisioner</span></div>
			<div class="workspace" id="workspace"></div>
			<h1>Welcome back</h1>

			<form id="form">
				<div class="form-group">
					<label>Email</label>
					<input type="email" id="email" required />
				</div>
				<div class="form-group">
					<label>Password</label>
					<input type="password" id="password" required />
				</div>
				<p class="error" id="error"></p>
				<button class="btn" type="submit" id="btn">Sign in</button>
			</form>
		</div>

		<script>
			// show current workspace from subdomain
			const host = window.location.hostname;
			const sub = host.split('.')[0];
			if (sub && sub !== 'app') {
				document.getElementById('workspace').textContent = host;
			}

			document
				.getElementById('form')
				.addEventListener('submit', async function (e) {
					e.preventDefault();
					const btn = document.getElementById('btn');
					const err = document.getElementById('error');
					err.style.display = 'none';
					btn.disabled = true;
					btn.textContent = 'Signing in...';

					try {
						const res = await fetch('/api/login', {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({
								email: document.getElementById('email').value,
								password: document.getElementById('password').value,
							}),
						});

						const data = await res.json();

						if (!res.ok) {
							err.textContent = data.error || 'Invalid email or password';
							err.style.display = 'block';
							btn.disabled = false;
							btn.textContent = 'Sign in';
							return;
						}

						// store JWT and redirect to dashboard
						localStorage.setItem('token', data.token);
						localStorage.setItem('tenant_id', data.tenant_id);
						window.location.href = '/dashboard.html';
					} catch (e) {
						err.textContent = 'Network error';
						err.style.display = 'block';
						btn.disabled = false;
						btn.textContent = 'Sign in';
					}
				});
		</script>
	</body>
</html>
